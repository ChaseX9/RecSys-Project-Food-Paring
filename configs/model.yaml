graph:
  alpha: 0.7          # weight on NPMI (1-alpha on chemical Jaccard)
  top_k: 50           # max neighbors kept per ingredient after fusion
  min_cooccur: 2      # min co-occurrence count for NPMI edges

model:
  emb_dim: 64
  n_layers: 3         # L in LightGCN
  n_groups: 2         # G ≤ L contrastive view groups (prefer lower layers)
  temperature: 0.2
  scope: heterogeneous

train:
  epochs: 150         # upper bound: early stopping on val picks the epoch
  batch_size: 4096
  lr: 0.005           # chosen on val among 1e-3 / 5e-3 / 1e-2 (1e-3 underfits)
  lambda_cl: 0.1      # weight of NLGCL contrastive loss (1e-5 had no effect: same scores as LightGCN, see ablations)
  lambda_reg: 1.0e-4  # L2 on embeddings
  seed: 42
  log_every: 5
  val_every: 1        # validate every N epochs (val split only, never test)
  select_on: val_emb_ndcg@10   # keep the best epoch on this val metric (embedding alone = model quality)
  patience: 15        # stop after N validations without improvement (null = never)
  val_max_cases: null # null = all val cases

# Weights chosen on the val split (grid search), never on test.
ranking:
  alpha_emb: 0.35       # NLGCL embedding similarity
  beta_chem: 0.025      # shared aromatic compounds (FlavorGraph). Every beta > 0 costs NDCG on val
                        # (0.1: 0.2985, 0.025: 0.3134, 0: 0.3159); 0.025 = best val NDCG with chemistry
                        # kept, for explanations and grounded@10 (scripts/tune_ranking.py)
  gamma_pref: 0.2       # user taste profile (product choice: personalization on)
  pref_source: rating   # profile from ratings 1-5 (centered, shrunk), see src/data/rating_profiles.py
  pref_mode: multiplicative   # preference only re-orders plausible pairings
  profile_combine: net  # consistency per ingredient: (liked - disliked) / (liked + disliked + alpha)
  profile_alpha: 5.0    # smoothing, in typical ratings (best net setting on val)
  dislike_below_rating: 3   # only 1/5 and 2/5 count as dislikes
  neg_weight: 0.5       # only used by profile_combine: separate
  profile_idf: false    # idf removed the signal on val (common ingredients are predictive)
  profile_conf_k: 10    # users with few ratings are trusted less
  delta_cooc: 0.7       # log co-occurrence in train recipes
  emb_similarity: cosine
  normalize: true       # min-max each component per query so the weights are comparable
  top_k: 20
